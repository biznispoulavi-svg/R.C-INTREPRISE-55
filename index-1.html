function payLabel(p){

document.addEventListener('click',async function(e){
 var g=e.target.closest('[data-go]');if(g){location.hash='#'+g.getAttribute('data-go');return}
 var t=e.target.closest('[data-act]');if(!t)return;
 var a=t.getAttribute('data-act'),id=t.getAttribute('data-id'),v=t.getAttribute('data-v');
 if(a==='scrim'){if(e.target===t){modal=null;render()}return}
 if(a==='close'){modal=null;render();return}
 if(a==='ktab'){kTab=v;render();return}
 if(a==='chtab'){chTab=v;render();return}
 if(a==='atab'){admTab=v;render();return}
 if(a==='scat'){storeCat=v;render();return}
 if(a==='logout'){S.session=null;save();render();return}

 if(a==='share'){try{await navigator.clipboard.writeText(SHARE_URL);toast('Lyen an kopye')}catch(x){toast('Kopye lyen an: '+SHARE_URL)}return}

 if(a==='cart'){modal={t:'cart'};render();return}
 if(a==='cq'){var it=S.cart[+t.getAttribute('data-i')];it.qty+=+t.getAttribute('data-d');if(it.qty<1)S.cart.splice(+t.getAttribute('data-i'),1);save();render();return}
 if(a==='pay'){
  var k=t.getAttribute('data-kind'),amt=+t.getAttribute('data-amt');
  if(k==='order')openPay({kind:'order',orderId:+t.getAttribute('data-oid'),amt:amt,label:'kòmand #'+t.getAttribute('data-oid')});
  else{var c=S.carnets.find(function(c){return c.id===+t.getAttribute('data-cid')}),i=+t.getAttribute('data-idx');openPay({kind:'carnet',carnetId:c.id,index:i,amt:amt,label:def(c).name+' · '+stepLabel(c,i),multi:(c.type!=='pen'&&i>0),unit:def(c).unit.toLowerCase()})}
  return}
 if(a==='req-ans'){var r=S.requests.find(function(r){return r.id===+id});r.status=v;note(r.clientId,'Ou '+(v==='aksepte'?'aksepte':'refize')+' pwopozisyon an.');save();render();return}
 if(a==='pv'||a==='pr'){
  var p=S.payments.find(function(p){return p.id===+id});if(!p||p.status!=='pending')return;
  if(a==='pv'){
   var dup=S.payments.some(function(q){return q.id!==p.id&&q.status==='valid'&&p.ref&&q.ref&&q.ref.toLowerCase()===p.ref.toLowerCase()});
   if(dup){toast('Nimewo tranzaksyon sa a deja valide.');return}
   var cc=S.carnets.find(function(c){return c.id===p.carnetId});

   p.status='valid';p.validatedAt=new Date().toISOString();

  var cc=S.clients.find(function(c){return digits(c.tel)===tl});

  if(!cc.hash){toast('Administratè a poko voye kòd ou. Kontakte nou sou WhatsApp '+WA+'.');return}
  if(cc.hash!==hh){toast('Telefòn oswa kòd pa kòrèk.');return}
  S.session=cc.id;regDone=false;save();render();return}
 if(!m&&['register','login','reply','prod-add','settings','calc','cart-add'].indexOf(n)<0){toast('Konekte dabò.');return}
 if(n==='start-ep'||n==='start-epay'){
  var c3={id:uid('k'),clientId:m.id,type:n==='start-ep'?'epargne':'epay',createdAt:new Date().toISOString()};if(c3.type==='epargne')c3.plan=+g('plan');else c3.value=+g('v');

  var nx=nextStep(c3);if(nx&&nx.i===0)openPay({kind:'carnet',carnetId:c3.id,index:0,amt:nx.amt,label:'frè enskripsyon '+def(c3).name});else render();return}
 if(n==='start-pen'){var c4={id:uid('k'),clientId:m.id,type:'pen',createdAt:new Date().toISOString()};S.carnets.push(c4);audit('Nouvo kanè Pen ak ze #'+c4.id+' ('+cname(m.id)+')');save();openPay({kind:'carnet',carnetId:c4.id,index:0,amt:1500,label:'frè enskripsyon Pen ak ze'});return}
 if(n==='pay'){
  var x=modal.ctx,amount=x.amt,count=1;
  if((await sha(g('code')))!==m.hash){toast('Kòd sekrè pa kòrèk. Peman an pa voye.');return}

  if(!x.multi){amount=Math.round(+g('amount'));if(amount!==x.amt){toast('Montan an dwe '+fmt(x.amt)+'.');return}}
  if(x.multi){var c0=S.carnets.find(function(c){return c.id===x.carnetId}),D0=def(c0);amount=Math.round(+g('amount'));
   if(!(amount>=x.amt)){toast('Montan an dwe omwen '+fmt(x.amt)+'.');return}
   var rest=costFor(c0,x.index,D0.n-x.index+1);if(amount>rest){toast('Montan an depase sa ki rete ('+fmt(rest)+').');return}
   count=stepsFor(c0,x.index,amount)}
  var pm={id:uid('p'),clientId:m.id,kind:x.kind==='order'?'order':(x.index===0?'fee':def(S.carnets.find(function(c){return c.id===x.carnetId})).kind),carnetId:x.carnetId||null,orderId:x.orderId||null,index:x.index==null?null:x.index,amount:amount,count:count,method:'NatCash',proof:proof,ref:'',status:'pending',createdAt:new Date().toISOString()};
  S.payments.push(pm);note(m.id,'Peman '+fmt(pm.amount)+' voye ak kòd sekrè ou ('+payLabel(pm)+'). An atant validasyon.');audit('Peman #'+pm.id+' voye ('+fmt(pm.amount)+', '+cname(m.id)+')');save();modal=null;render();toast('Peman voye. An atant validasyon.');return}
